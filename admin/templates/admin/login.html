<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Sahaay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-admin-dark { background-color: #0f2a52; }
        .bg-admin-card { background-color: #163a7a; }
    </style>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center px-4">
    <div class="max-w-md w-full">
        <!-- Logo/Header -->
        <div class="text-center mb-8">
            <h1 class="text-white text-4xl font-bold mb-2">Sahaay</h1>
            <p class="text-gray-400 text-lg">Admin Panel</p>
        </div>
        
        <!-- Login Card -->
        <div class="bg-admin-card shadow-2xl rounded-2xl p-8">
            <h2 class="text-white text-2xl font-semibold mb-6 text-center">Sign In</h2>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="mb-6">
                {% for category, message in messages %}
                    <div class="p-4 rounded-lg {% if category == 'danger' %}bg-red-600{% else %}bg-blue-600{% endif %} text-white text-sm" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
                </div>
            {% endif %}
            {% endwith %}
            
            <form method="post" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-200 mb-2">Email Address</label>
                    <input 
                        type="email" 
                        id="email"
                        name="email" 
                        required
                        class="w-full px-4 py-3 bg-gray-800 text-white rounded-md border border-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors"
                        placeholder="admin@sahaay.ai"
                        autocomplete="email"
                    >
                </div>
                
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-200 mb-2">Password</label>
                    <input 
                        type="password" 
                        id="password"
                        name="password" 
                        required
                        class="w-full px-4 py-3 bg-gray-800 text-white rounded-md border border-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors"
                        placeholder="••••••••"
                        autocomplete="current-password"
                    >
                </div>
                
                <button 
                    type="submit" 
                    class="w-full px-4 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-admin-card transition-colors"
                >
                    Sign In
                </button>
            </form>
        </div>
        
        <!-- Footer Note -->
        <p class="text-center text-gray-500 text-sm mt-6">
            For authorized personnel only
        </p>
    </div>
</body>
</html>
